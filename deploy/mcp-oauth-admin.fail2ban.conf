# /etc/fail2ban/filter.d/mcp-oauth-admin.conf
#
# 配合 jail:
#   [mcp-oauth-admin]
#   enabled     = true
#   backend     = systemd
#   journalmatch = _SYSTEMD_UNIT=mcp-oauth-gateway.service
#   filter      = mcp-oauth-admin
#   port        = http,https
#   maxretry    = 3
#   findtime    = 600
#   bantime     = 24h
#
# 说明：
#   * 只看 uvicorn 的 access log；真实客户端 IP 在 X-Forwarded-For（日志里显示成 ip:0）
#   * 只数密码失败，不要匹配 POST /mcp 的 401 —— 那是令牌过期的正常回执，
#     匹配上会把正常客户端封掉
[Definition]
failregex = ^INFO:\s+<HOST>:\d+ - "POST /admin HTTP/[\d.]+" 401
            ^INFO:\s+<HOST>:\d+ - "POST /oauth/authorize HTTP/[\d.]+" 401
ignoreregex =
